<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<!-- Gerador local da imagem de compartilhamento (public/og.png). Não faz parte do site. Rode: node scripts/marca.mjs -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #FFF8EC; color: #1B1A24; font-family: 'Inter Tight', sans-serif; overflow: hidden; }
  .frame { position: absolute; inset: 36px 40px 44px 36px; border: 3px solid #1B1A24; box-shadow: 8px 8px 0 #1B1A24; background: #FFF8EC;
           display: grid; grid-template-rows: auto 1fr auto; }
  .top { display: flex; align-items: center; gap: 10px; padding: 18px 28px; border-bottom: 3px solid #1B1A24; }
  .top img { width: 56px; height: 56px; image-rendering: pixelated; }
  .name { font-weight: 800; font-size: 40px; letter-spacing: -0.045em; line-height: 1; }
  .sub { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; color: #5A30D9; margin-top: 3px; }
  .mid { display: grid; grid-template-columns: 1fr 360px; align-items: center; padding: 0 28px; }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -0.045em; line-height: .98; }
  mark { background: #FFD23F; color: #1B1A24; padding: 0 .08em; }
  .cloud { position: relative; justify-self: center; text-align: center; }
  .cloud img { width: 300px; height: 300px; image-rendering: pixelated; display: block; }
  .cloud span { display: inline-block; margin-top: -26px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px;
                background: #1B1A24; color: #FFF8EC; padding: 9px 12px; }
  .bottom { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; border-top: 3px solid #1B1A24; font-size: 24px; font-weight: 700; }
  .bottom .muted { color: #5E5A6B; font-weight: 500; }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <img src="../dist/marca/simbolo.svg" alt="" />
      <div><div class="name">lgnk</div><div class="sub">sistemas</div></div>
    </div>
    <div class="mid">
      <h1>Sistemas que <mark>aguentam</mark> <span style="white-space: nowrap">o dia a dia.</span></h1>
      <div class="cloud"><img src="../dist/marca/simbolo.svg" alt="" /><span>esperando pedidos_</span></div>
    </div>
    <div class="bottom"><span>lgnk.com.br</span><span class="muted">Software sob medida · Belo Horizonte, MG</span></div>
  </div>
</body>
</html>
