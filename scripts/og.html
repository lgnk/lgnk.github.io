<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<!-- Gerador local da imagem de compartilhamento (public/og.png). Não faz parte do site. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Instrument+Serif:ital@1&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f3f0ea; color: #111; font-family: 'Inter Tight', sans-serif; }
  .frame { position: absolute; inset: 40px 56px; display: grid; grid-template-rows: auto 1fr auto; }
  .top { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 18px; border-bottom: 1px solid #111; }
  .brand { font-weight: 800; font-size: 26px; letter-spacing: .14em; }
  .brand span { font-weight: 500; font-size: 18px; letter-spacing: .06em; margin-left: 10px; }
  .tag { font-size: 20px; font-weight: 500; color: #555; }
  h1 { align-self: center; font-size: 104px; font-weight: 700; letter-spacing: -.045em; line-height: .95; }
  em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #c23a0f; letter-spacing: -.01em; }
  .bottom { display: flex; justify-content: space-between; padding-top: 18px; border-top: 1px solid #111; font-size: 22px; font-weight: 600; }
  .bottom .muted { color: #555; font-weight: 500; }
</style>
</head>
<body>
  <div class="frame">
    <div class="top"><div class="brand">LGNK<span>SISTEMAS</span></div><div class="tag">Software sob medida para PMEs</div></div>
    <h1>Sistemas que <em>aguentam</em><br />o dia a dia.</h1>
    <div class="bottom"><span>lgnk.com.br</span><span class="muted">Belo Horizonte, MG</span></div>
  </div>
</body>
</html>
