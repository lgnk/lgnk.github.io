<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<!-- Gerador local do logo em PNG (marca/logo.png). Não faz parte do site. Rode: node scripts/marca.mjs -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  #logo { display: inline-flex; align-items: center; gap: 24px; padding: 40px 56px 40px 32px; color: #1B1A24; }
  #logo img { width: 360px; height: 360px; image-rendering: pixelated; }
  .name { font-family: 'Inter Tight', sans-serif; font-weight: 800; font-size: 236px; letter-spacing: -0.045em; line-height: .9; }
  .sub { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 64px; color: #5A30D9; margin-top: 40px; }
</style>
</head>
<body>
  <div id="logo">
    <img src="../dist/marca/simbolo.svg" alt="" />
    <div><div class="name">lgnk</div><div class="sub">sistemas</div></div>
  </div>
</body>
</html>
